name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_only:
        description: 'Only build/upload the Android APK to an existing release tag'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Existing release tag to upload the APK to when android_only is enabled'
        required: false
        type: string

jobs:
  release-desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.android_only != true
    outputs:
      releaseId: ${{ steps.desktop_tauri.outputs.releaseId }}
      appVersion: ${{ steps.desktop_tauri.outputs.appVersion }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: prepare tauri signing key
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'tauri.key'
          $key = $env:TAURI_PRIVATE_KEY.Trim()
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($keyPath, $key, $encoding)
          "TAURI_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: build and release
        id: desktop_tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_STUN_URLS: ${{ secrets.VITE_STUN_URLS }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        with:
          tagName: v__VERSION__
          releaseName: 'DogitoChat v__VERSION__'
          releaseBody: 'Download the installer or Android APK below to install or update DogitoChat.'
          releaseDraft: false
          prerelease: false

  release-android:
    needs: release-desktop
    if: github.event_name != 'workflow_dispatch' || inputs.android_only != true
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        run: npm ci

      - name: init tauri android project
        run: npm run tauri android init

      - name: patch android project
        run: node scripts/patch-android-project.mjs

      - name: write firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > src-tauri/gen/android/app/google-services.json

      - name: setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "storeType=JKS" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build android apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_STUN_URLS: ${{ secrets.VITE_STUN_URLS }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npx tauri android build --apk

      - name: upload android apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find src-tauri/gen/android -path '*release*.apk' | head -n 1)
          test -n "$APK_PATH"
          gh release upload ${{ github.ref_name }} "$APK_PATH" --clobber

      - name: create android latest manifest
        run: |
          APK_PATH=$(find src-tauri/gen/android -path '*release*.apk' | head -n 1)
          APK_FILE=$(basename "$APK_PATH")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$APK_FILE"
          node scripts/create-android-latest-manifest.mjs ${{ needs.release-desktop.outputs.appVersion }} "$APK_URL" "Download the latest DogitoChat Android APK from this release."

      - name: upload android latest manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} android-latest.json --clobber

  release-android-only:
    if: github.event_name == 'workflow_dispatch' && inputs.android_only == true
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: ensure release tag input exists
        run: test -n "${{ inputs.release_tag }}"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        run: npm ci

      - name: init tauri android project
        run: npm run tauri android init

      - name: patch android project
        run: node scripts/patch-android-project.mjs

      - name: write firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > src-tauri/gen/android/app/google-services.json

      - name: setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "storeType=JKS" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build android apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_STUN_URLS: ${{ secrets.VITE_STUN_URLS }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npx tauri android build --apk

      - name: upload android apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find src-tauri/gen/android -path '*release*.apk' | head -n 1)
          test -n "$APK_PATH"
          gh release upload ${{ inputs.release_tag }} "$APK_PATH" --clobber

      - name: create android latest manifest
        run: |
          APK_PATH=$(find src-tauri/gen/android -path '*release*.apk' | head -n 1)
          APK_FILE=$(basename "$APK_PATH")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$APK_FILE"
          VERSION="${{ inputs.release_tag }}"
          VERSION=${VERSION#v}
          node scripts/create-android-latest-manifest.mjs "$VERSION" "$APK_URL" "Download the latest DogitoChat Android APK from this release."

      - name: upload android latest manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.release_tag }} android-latest.json --clobber
